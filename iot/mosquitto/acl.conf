# ACL por dispositivo: %u = CN do certificado (ID pseudonimizado do veículo).
# Um veículo só PUBLICA no próprio tópico e só LÊ os próprios comandos.
# Não consegue ler telemetria de outros veículos nem publicar em nome deles.
pattern write vehicles/%u/telemetry
pattern read  vehicles/%u/commands

# Serviço de ingestão (certificado CN=ingestion-service) lê a telemetria de todos, sem escrever.
user ingestion-service
topic read vehicles/+/telemetry
