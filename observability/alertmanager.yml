# Roteamento de alertas: critical -> plantão (e canal de segurança); warning -> canal do time.
# As URLs de webhook (fluxo do Teams / Power Automate) ficam em arquivos montados como
# segredo, nunca neste arquivo versionado.
route:
  receiver: teams-time
  group_by: [alertname, area]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: seguranca-plantao
      repeat_interval: 30m

receivers:
  - name: teams-time
    msteamsv2_configs:
      - webhook_url_file: /run/secrets/teams_webhook_time
        send_resolved: true

  - name: seguranca-plantao
    msteamsv2_configs:
      - webhook_url_file: /run/secrets/teams_webhook_seguranca
        send_resolved: true

inhibit_rules:
  # Se a API está fora (5xx), não inundar o plantão com alertas derivados
  - source_matchers: [alertname="ErrosServidor"]
    target_matchers: [area="api", severity="warning"]
    equal: [area]
