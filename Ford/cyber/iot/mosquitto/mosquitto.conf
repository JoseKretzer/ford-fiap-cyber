# Broker MQTT da telemetria veicular (veículos conectados -> VIN Share)
# TLS obrigatório + autenticação mútua por certificado (mTLS). Sem porta em texto claro.

per_listener_settings false
allow_anonymous false

listener 8883
protocol mqtt
tls_version tlsv1.2
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile  /mosquitto/certs/broker.key
require_certificate true            # cada módulo telemático tem seu próprio certificado
use_identity_as_username true       # CN do certificado = ID do dispositivo (usado na ACL)
ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256

# Certificados revogados (dispositivo roubado/comprometido) são recusados
crlfile /mosquitto/certs/crl.pem

acl_file /mosquitto/config/acl.conf

# Proteção contra abuso de recursos (max_packet_size substitui o message_size_limit, obsoleto no 2.x)
max_packet_size 4096
max_inflight_messages 20
max_queued_messages 100

log_type error
log_type warning
log_type notice
log_type subscribe
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
